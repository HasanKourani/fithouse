<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <meta name="theme-color" content="#444341">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:site_name" content="Fit House">
  <meta property="og:url" content="{{url}}">
  <!-- Link previews (WhatsApp, Instagram, X) need the image as a full https address -->
  <meta property="og:image" content="{{site}}assets/img/og-image.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="The Fit House logo beside a window looking out onto trees from the gym floor">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="{{url}}">
  <link rel="icon" href="assets/img/favicon.png" type="image/png" sizes="128x128">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;0,900;1,300;1,700;1,900&family=Tajawal:wght@300;400;700;900&display=swap">
  <link rel="stylesheet" href="assets/css/styles.css?v={{v}}">
  <script>
    // Animations are always on. If the last page left through the curtain, start this one behind it.
    (function () {
      var root = document.documentElement, curtain = null;
      root.classList.add('js', 'motion');
      try { curtain = sessionStorage.getItem('fithouse-curtain'); } catch (e) {}
      if (curtain) root.classList.add('is-arriving');
    })();
  </script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "ExerciseGym",
    "name": "Fit House",
    "slogan": "Let the outside in",
    "telephone": "+961 76 684 096",
    "address": {"@type": "PostalAddress", "streetAddress": "Housh", "addressLocality": "Tyre", "addressCountry": "LB"},
    "geo": {"@type": "GeoCoordinates", "latitude": 33.240566, "longitude": 35.239929},
    "openingHoursSpecification": [
      {"@type": "OpeningHoursSpecification", "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"], "opens": "08:00", "closes": "22:00"},
      {"@type": "OpeningHoursSpecification", "dayOfWeek": "Saturday", "opens": "13:00", "closes": "18:30"}
    ],
    "sameAs": ["https://www.instagram.com/fithouselb/"]
  }
  </script>
</head>
<body data-page="{{page}}">
  <!-- comment -->
  <!-- Green curtain that wipes between pages (motion on only). First in the body so it
       covers the page before anything else paints. -->
  <div class="curtain" id="curtain" aria-hidden="true">
    <span class="curtain__mark mark" aria-hidden="true"><span class="mark__roof"></span><span class="mark__fig"></span></span>
  </div>
  <svg class="sprite" aria-hidden="true" focusable="false">
    <defs>
      <path id="leaf" d="M0 0C20-16 58-18 92 0C58 18 20 16 0 0Z" fill="currentColor"/>
    </defs>
    <symbol id="chevrons" viewBox="0 0 30 14">
      <path d="M2 2l5 5-5 5M11.5 2l5 5-5 5M21 2l5 5-5 5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <!-- Leaf shadows that fall across every "outside" surface -->
    <symbol id="leaves" viewBox="0 0 600 800" preserveAspectRatio="xMaxYMin slice">
      <path d="M640-30C540 110 430 230 255 440" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round"/>
      <use href="#leaf" transform="translate(588 44) rotate(78) scale(1.15)"/>
      <use href="#leaf" transform="translate(566 74) rotate(172) scale(1.05)"/>
      <use href="#leaf" transform="translate(505 148) rotate(66) scale(1.3)"/>
      <use href="#leaf" transform="translate(482 176) rotate(186) scale(1.15)"/>
      <use href="#leaf" transform="translate(424 238) rotate(58) scale(1.4)"/>
      <use href="#leaf" transform="translate(398 266) rotate(192) scale(1.25)"/>
      <use href="#leaf" transform="translate(344 330) rotate(74) scale(1.2)"/>
      <use href="#leaf" transform="translate(312 362) rotate(176) scale(1.3)"/>
      <use href="#leaf" transform="translate(262 430) rotate(128) scale(1.25)"/>
      <path d="M-30 830C70 710 160 650 310 600" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>
      <use href="#leaf" transform="translate(40 760) rotate(-62) scale(1.1)"/>
      <use href="#leaf" transform="translate(62 746) rotate(22) scale(1.05)"/>
      <use href="#leaf" transform="translate(122 690) rotate(-72) scale(1.25)"/>
      <use href="#leaf" transform="translate(146 678) rotate(12) scale(1.15)"/>
      <use href="#leaf" transform="translate(204 644) rotate(-48) scale(1.2)"/>
      <use href="#leaf" transform="translate(230 634) rotate(30) scale(1.1)"/>
      <use href="#leaf" transform="translate(304 602) rotate(-16) scale(1.2)"/>
    </symbol>
  </svg>

  <a class="skip" href="#content" data-i18n="skip">Skip to content</a>

  <header class="nav" id="nav">
    <div class="nav__bar">
      <a class="brand" href="index.html" data-i18n-attr="aria-label:brand.label" aria-label="Fit House home">
        <span class="brand__mark mark" aria-hidden="true"><span class="mark__roof"></span><span class="mark__fig"></span></span>
        <span class="brand__word" lang="en">Fit House</span>
      </a>
      <nav class="nav__links" id="nav-links" data-i18n-attr="aria-label:nav.label" aria-label="Main">
        <a href="house.html"{{current:house}} data-i18n="nav.house">The house</a>
        <a href="classes.html"{{current:classes}} data-i18n="nav.classes">Classes</a>
        <a href="cafe.html"{{current:cafe}} data-i18n="nav.cafe">Café</a>
        <a href="bundles.html"{{current:bundles}} data-i18n="nav.bundles">Bundles</a>
        <a href="visit.html"{{current:visit}} data-i18n="nav.visit">Visit</a>
        <a class="nav__links-book" href="book.html"{{current:book}} data-i18n="nav.book">Book a class</a>
      </nav>
      <div class="nav__actions">
        <button class="lang" type="button" id="lang-toggle" lang="ar">عربي</button>
        <a class="btn btn--moss btn--small nav__book" href="book.html" data-i18n="nav.book">Book a class</a>
        <button class="nav__menu" type="button" id="nav-menu" aria-expanded="false" aria-controls="nav-links" data-i18n="nav.menu">Menu</button>
      </div>
      <!-- Scroll progress under the pill, with the logo figure running along it -->
      <div class="progress" id="progress" aria-hidden="true">
        <span class="progress__bar"></span>
        <span class="progress__runner mark" aria-hidden="true"><span class="mark__roof"></span><span class="mark__fig"></span></span>
      </div>
    </div>
  </header>

  <main id="content">
{{content}}
  </main>

  <footer class="footer">
    <div class="wrap footer__grid">
      <div class="footer__brand" lang="en">
        <span class="footer__mark mark" aria-hidden="true"><span class="mark__roof"></span><span class="mark__fig"></span></span>
        <p class="footer__tag">Let the outside in</p>
      </div>
      <nav class="footer__pages" data-i18n-attr="aria-label:footer.pages" aria-label="All pages">
        <a href="index.html" data-i18n="nav.home">Home</a>
        <a href="house.html" data-i18n="nav.house">The house</a>
        <a href="classes.html" data-i18n="nav.classes">Classes</a>
        <a href="cafe.html" data-i18n="nav.cafe">Café</a>
        <a href="bundles.html" data-i18n="nav.bundles">Bundles</a>
        <a href="visit.html" data-i18n="nav.visit">Visit</a>
        <a href="book.html" data-i18n="nav.book">Book a class</a>
      </nav>
      <ul class="footer__links">
        <li><a href="https://www.instagram.com/fithouselb/" target="_blank" rel="noopener">Instagram <span lang="en" dir="ltr">@fithouselb</span></a></li>
        <li><a href="tel:+96176684096"><span data-i18n="footer.call">Call</span> <span dir="ltr">76 684 096</span></a></li>
      </ul>
      <div class="footer__legal">
        <p data-i18n="footer.legal">© 2026 Fit House. Housh, Tyre.</p>
      </div>
    </div>
    <!-- Edge-to-edge wordmark; its letters wave on hover -->
    <p class="footer__word" id="footer-word" lang="en">Fit House</p>
  </footer>

  <!-- Cursor ring that follows the mouse (motion on, mouse only) -->
  <div class="cursor" id="cursor" aria-hidden="true"><span class="cursor__ring"></span><span class="cursor__dot"></span></div>

  <script src="assets/js/main.js?v={{v}}" defer></script>
</body>
</html>
